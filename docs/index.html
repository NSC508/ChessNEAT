<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessNEAT - Play Against Neural Network</title>
    <!-- jQuery is required for chessboard.js -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <!-- chessboard.js for board UI -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <!-- chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <!-- Custom styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>ChessNEAT AI</h1>
            <p>Play against a NEAT-evolved Neural Network.</p>
        </header>

        <!-- Main Game Area -->
        <div class="game-layout">
            <div class="board-wrapper">
                <div id="board" class="glass-panel"></div>
            </div>
            
            <div class="sidebar glass-panel">
                <div class="status-panel">
                    <h3>Status</h3>
                    <div id="status">Loading AI model...</div>
                </div>
                
                <div class="controls">
                    <button id="newGameBtn" class="btn primary" disabled>New Game</button>
                    <button id="undoBtn" class="btn secondary" disabled>Undo Move</button>
                    <button id="flipBtn" class="btn secondary" disabled>Flip Board</button>
                </div>
                
                <div class="pgn-panel">
                    <h3>Move History</h3>
                    <div id="pgn" class="pgn-text"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Our Application Logic -->
    <script src="js/neat_network.js"></script>
    <script src="js/ai_player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
